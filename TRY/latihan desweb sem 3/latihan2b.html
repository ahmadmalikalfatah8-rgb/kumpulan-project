<!DOCTYPE html>
<html>
<head>
    <title>Desain Responsif</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        #wrapper{
            margin: auto;
            width: 100%;
        }

        #header{
            padding: 20px;
            border: 2px solid red;
        }

        #nav{
            margin: auto;
            padding: 20px;
            border: 2px solid red;
            display: flex;
            flex-wrap: wrap;
            gap: 2%;
        }

        .box{
            width: 22%;
            margin-bottom: 20px;
            height: 120px;
            background: red;
            border: 2px solid red;
            box-sizing: border-box;
        }

        #footer{
            padding: 20px;
            border: 2px solid red;
        }

        /* Tablet */
        @media only screen and (max-width: 1000px){            
            .box{
                width: 48%; 
            }
        }

        /* Smartphone */
        @media only screen and (max-width: 640px){
            .box{
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <div id="header">
            <h2>Header</h2>
        </div>

        <div id="nav">
            <h2>Services</h2>
            <div class="box"> BOX 1 </div>
            <div class="box"> BOX 2 </div>
            <div class="box"> BOX 3 </div>
            <div class="box"> BOX 4 </div>
        </div>

        <div id="footer">
            <h2>Footer</h2>
        </div>
    </div>
</body>
</html>
