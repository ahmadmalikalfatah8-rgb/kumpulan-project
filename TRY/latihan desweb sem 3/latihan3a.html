<!DOCTYPE html>
<html>
<head>
    <title>Animasi Transisi CSS3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style type="text/css">
        .box{
            width: 40%;
            height: 100px;
            background: orange;
            border: 2px solid #212121;
            transition: all 1s ease-in-out;
        }
        @keyframes putarBaling {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Landscape */
        @media (orientation: landscape){
            .box{
                width: 100%;
                background: blue;
                border-radius: 50%; 
                animation: putarBaling 2s linear infinite;
            }
        }
    </style>
</head>
<body>
    <h3>Transisi CSS3</h3>
    <div class="box"></div>
    <p>Ubah orientasi ke landscape/portrait...</p>
</body>
</html>
