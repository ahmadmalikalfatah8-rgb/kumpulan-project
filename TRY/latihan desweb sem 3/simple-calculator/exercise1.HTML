<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple Calculator</title>
</head>
<body>
  <h1>Simple Calculator</h1>

  <input type="number" id="a" placeholder="First number">
  <input type="number" id="b" placeholder="Second number">
  <br><br>

  <button onclick="sum('+')">Add</button>
  <button onclick="sum('-')">Subtract</button>
  <button onclick="sum('*')">Multiply</button>
  <button onclick="sum('/')">Divide</button>

  <h2>Result: <span id="result">-</span></h2>

  <script src="exercise1.js"></script>
</body>
</html>
